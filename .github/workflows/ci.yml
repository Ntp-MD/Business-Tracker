name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Python dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Python tests
        run: python -m unittest discover -s tests

      - name: Python compile
        run: python -m py_compile backend/server.py backend/db.py backend/pw_login.py

      - name: Web typecheck
        run: npx tsc --noEmit -p apps/web/tsconfig.json

      - name: Worker typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Playwright
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Read-only E2E
        run: python -m unittest discover -s e2e -v
