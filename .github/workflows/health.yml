name: Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Force the alert path for testing
        type: boolean
        default: false
      health_urls:
        description: Comma-separated health URLs (blank uses prod + live)
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check health
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
          HEALTH_URLS: ${{ inputs.health_urls }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo "simulated health failure" >&2
            exit 1
          fi
          python scripts/check_health.py

      - name: Open or update issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Health check failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Health check failed at ${new Date().toISOString()}.\n\nRun: ${runUrl}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              core.info(`Issue #${existing.number} is already open.`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Close recovered issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Health check failing";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "Health check recovered; closing.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
